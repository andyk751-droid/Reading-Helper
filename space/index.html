<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decode Space Adventure</title>
<link rel="icon" type="image/png" href="img/owl-64.png">
<link rel="apple-touch-icon" href="img/owl-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121A3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Decode">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F8;--surface:#FFFFFF;--ink:#1B2540;--muted:#56637F;--line:#D3DBE8;
  --cobalt:#2F4BDB;--cobalt-deep:#1F35A8;--on-cobalt:#FFFFFF;
  --sun:#E39A00;--mint:#12936F;--coral:#E06A00;--tile:#FFFFFF;--tile-ink:#1B2540;
  --c-swap:#7A5AF0;--c-spell:#2F6FE0;--c-flip:#DD6A12;--c-forge:#16936A;--c-speed:#D93E75;--c-lab:#0E8FA8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A2D;--surface:#1A2540;--ink:#E7ECF6;--muted:#A6B3CE;--line:#2E3C5E;
    --cobalt:#6F86FF;--cobalt-deep:#3E55C9;--on-cobalt:#0E1630;
    --sun:#FFC23A;--mint:#35D0A0;--coral:#FF9A4D;--tile:#233052;--tile-ink:#F1F4FA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A2D;--surface:#1A2540;--ink:#E7ECF6;--muted:#A6B3CE;--line:#2E3C5E;
  --cobalt:#6F86FF;--cobalt-deep:#3E55C9;--on-cobalt:#0E1630;
  --sun:#FFC23A;--mint:#35D0A0;--coral:#FF9A4D;--tile:#233052;--tile-ink:#F1F4FA;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:18px;background:var(--bg)}
html.size-l{font-size:20px}
html.size-xl{font-size:23px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
body.spaced{letter-spacing:.06em;word-spacing:.16em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:10px}
.wrap{max-width:680px;margin:0 auto;padding:1rem 1.1rem 3rem}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding:.4rem 0 1.1rem}
.brand{display:flex;align-items:center;gap:.65rem;background:none;border:0;padding:0;color:inherit;text-align:left}
.brand .old-tile{display:inline-grid;place-items:center;width:1.55rem;height:1.75rem;font-weight:800;font-size:.95rem;background:var(--tile);color:var(--tile-ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:7px}
.hud{display:flex;gap:.5rem}
.pill{font-size:.9rem;font-weight:600;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:.25rem .75rem}

/* Home */
h1{font-size:1.9rem;line-height:1.15;margin:.1rem 0 .4rem;font-weight:800}
h2{font-size:1.45rem;line-height:1.2;margin:.2rem 0 .5rem;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.hero{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.hero p{margin:0}
.go-big{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;font-size:1.25rem;font-weight:800;color:#fff;background:var(--m,var(--cobalt));border:0;border-radius:16px;padding:1rem;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.go-big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.list-h{font-size:1rem;font-weight:700;margin:1.6rem 0 .6rem;color:var(--muted)}
.missions{list-style:none;margin:0 0 1.5rem;padding:0;display:grid;gap:.7rem}
.mission{width:100%;display:flex;align-items:center;gap:.9rem;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:.75rem .9rem;min-height:4.6rem}
.mission:hover{border-color:var(--m)}
.icon{flex:none;display:grid;place-items:center;width:3.2rem;height:3.2rem;font-size:1.7rem;background:var(--m);border-radius:14px}
.mtext{flex:1;display:flex;flex-direction:column}
.mname{font-weight:800;font-size:1.1rem}
.mdesc{color:var(--muted);font-size:.9rem;line-height:1.4}
.chip{flex:none;font-size:.78rem;font-weight:700;padding:.25rem .6rem;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.done{background:color-mix(in srgb,var(--mint) 20%,var(--surface));color:var(--mint)}
.link{background:none;border:0;color:var(--muted);font-weight:600;padding:.4rem 0}

/* Mission frame */
.bar{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.back,.help{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.45rem .85rem;font-size:.9rem;font-weight:600}
.bar-title{flex:1;display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.1rem}
.bar-title .icon{width:2.2rem;height:2.2rem;font-size:1.2rem;border-radius:10px}
.count{text-align:center;font-weight:700;color:var(--muted);font-size:.9rem;margin-bottom:.35rem}
.dots{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.2rem}
.dots i{width:.8rem;height:.8rem;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--m)}
.dots i.now{background:var(--m);outline:3px solid color-mix(in srgb,var(--m) 35%,transparent)}
.stage{display:flex;flex-direction:column;gap:1rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:1.2rem 1rem;display:flex;flex-direction:column;gap:1rem}
.prompt{font-size:1.2rem;font-weight:600;margin:0;text-align:center}
.do{display:inline-block;background:color-mix(in srgb,var(--m) 14%,var(--surface));border:2px solid var(--m);border-radius:12px;padding:.35rem .8rem;font-weight:700}
.word{font-size:3rem;font-weight:800;text-align:center;letter-spacing:.05em;margin:0}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
.center{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;background:var(--cobalt);color:var(--on-cobalt);border:0;border-radius:14px;padding:.8rem 1.3rem;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--cobalt-deep);transition:transform .08s;min-height:3.1rem}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--cobalt-deep)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.hear{background:var(--surface);color:var(--ink);border:2px solid var(--m);box-shadow:0 4px 0 var(--m)}
.btn.go{background:var(--mint);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--mint) 60%,#000)}
.btn.big{font-size:1.2rem;padding:.9rem 1.8rem}
.btn.danger{color:var(--coral)}
.answer-row{display:flex;gap:.6rem}
.answer-row input{flex:1;min-width:0;font-size:1.6rem;font-weight:700;padding:.6rem .9rem;border:3px solid var(--line);border-radius:14px;background:var(--tile);color:var(--tile-ink);text-align:center}
.answer-row input:focus{border-color:var(--m);outline:none}
.choices{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.choice{min-width:3.6rem;min-height:3.6rem;font-size:1.6rem;font-weight:800;padding:.5rem .9rem;background:var(--tile);color:var(--tile-ink);border:3px solid var(--line);border-bottom-width:6px;border-radius:14px}
.choice:hover:not(:disabled){border-color:var(--m)}
.choice.wide{min-width:9rem;font-size:1.9rem}
.choice.ok{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 22%,var(--tile))}
.choice.bad{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 15%,var(--tile));opacity:.7}

/* Tiles */
.tiles{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin:.2rem 0}
.tile{min-width:2.3rem;padding:.2rem .45rem;font-size:1.9rem;font-weight:700;text-align:center;line-height:1.2;background:var(--tile);color:var(--tile-ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:10px}
.tiles.sm .tile{font-size:1.4rem;min-width:1.95rem}
.tile.ok{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 22%,var(--tile))}
.tile.bad{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 16%,var(--tile))}
.tile.swap{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 28%,var(--tile))}
.fb .tile{animation:pop .25s ease-out both}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

.fb{text-align:center;display:flex;flex-direction:column;gap:.6rem;align-items:center}
.fb:empty{display:none}
.fb .row{justify-content:center;margin-top:.2rem}
.msg{margin:0;font-weight:700;font-size:1.15rem}
.msg.good{color:var(--mint)}
.msg.bad{color:var(--coral)}
.mean{margin:0;font-size:.95rem;text-align:left;width:100%;max-width:28rem;background:rgba(108,132,255,.12);border:1px solid rgba(140,160,255,.32);border-radius:12px;padding:.5rem .75rem}
.dots i.two{background:var(--sun);box-shadow:0 0 6px rgba(255,200,61,.55)}
.lbl-sm{margin:.2rem 0 0;font-size:.85rem;font-weight:700;color:var(--muted)}
.copy-box{display:flex;flex-direction:column;gap:.5rem;align-items:stretch;width:100%;max-width:28rem;background:rgba(10,15,36,.6);border:2px dashed var(--mint);border-radius:12px;padding:.7rem .8rem;text-align:center}
.copy-box .msg{color:var(--mint)}
.gain{margin:0;font-weight:800;color:var(--mint)}
.legend{font-size:.9rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.legend i{display:inline-block;width:1rem;height:1rem;border-radius:4px;border:3px solid;vertical-align:-2px;margin-right:.35rem}

.rule{background:color-mix(in srgb,var(--m) 10%,var(--surface));border:2px solid var(--m);border-radius:16px;padding:.8rem 1rem}
.rule-name{font-weight:800}
.rule p{margin:.25rem 0 0}
.mini-steps{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.mini-steps li{font-size:.85rem;font-weight:600;background:var(--bg);border-radius:999px;padding:.3rem .7rem}
.picks{display:grid;gap:.7rem}
.pick{text-align:left;display:flex;align-items:center;gap:.8rem;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:.9rem 1rem;min-height:4rem}
.pick:hover{border-color:var(--m)}
.pick .e{font-size:1.5rem}
.pick span.t{display:flex;flex-direction:column}

.sentence{font-size:1.45rem;text-align:center;margin:0;line-height:1.6;font-weight:500}
.blank{display:inline-block;min-width:4.5rem;border-bottom:4px solid var(--m);color:var(--m);font-weight:800}
.pair{display:flex;flex-direction:column;gap:.2rem;align-items:center}
.pair .lbl{font-size:.85rem;font-weight:600;color:var(--muted)}

.slots{min-height:4.4rem;display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;align-items:center;border:3px dashed var(--m);border-radius:16px;padding:.6rem;background:color-mix(in srgb,var(--m) 6%,var(--surface))}
.slots .hint{color:var(--muted);font-size:.95rem;font-weight:600}
.preview{text-align:center;font-size:1.7rem;font-weight:800;min-height:2.4rem;letter-spacing:.03em}
.bank{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center}
.part{display:flex;flex-direction:column;align-items:center;background:var(--tile);color:var(--tile-ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:.4rem .8rem .35rem;min-width:4rem}
.part b{font-size:1.45rem;font-weight:800;line-height:1.2}
.part small{font-size:.75rem;color:var(--muted);font-weight:600}
.part:disabled{opacity:.25;cursor:default}
.slots .part{border-color:var(--m)}
.built{font-size:2.4rem;font-weight:800;letter-spacing:.03em}

.how3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:0;padding:0;list-style:none}
.how3 li{background:var(--bg);border-radius:14px;padding:.6rem .4rem;text-align:center;font-size:.85rem;font-weight:600;line-height:1.3}
.how3 li b{display:block;font-size:1.4rem;margin-bottom:.15rem}
.how3 li.on{background:color-mix(in srgb,var(--m) 22%,var(--surface));outline:2px solid var(--m)}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;font-size:1.2rem;line-height:1.9;max-width:62ch}
.passage p{margin:0 0 .9em}
.passage p:last-child{margin:0}
.timer{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.bars{display:flex;gap:.7rem;align-items:flex-end;justify-content:center;height:9rem;padding-top:1.4rem}
.barcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:3rem}
.barcol .b{width:100%;background:color-mix(in srgb,var(--m) 55%,var(--surface));border-radius:8px 8px 3px 3px;min-height:6px}
.barcol .b.last{background:var(--m)}
.barcol .bv{font-weight:800;font-size:.95rem}
.barcol .bl{font-size:.72rem;color:var(--muted);margin-top:.2rem}

.finish{text-align:center;padding:1rem 0;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.trophy{font-size:3.5rem;line-height:1}
.stars{font-size:2.2rem;letter-spacing:.2em}
.big{font-size:1.4rem;font-weight:800;margin:0}
.finish .row{justify-content:center;margin-top:.8rem}

/* How-to-play overlay */
.overlay{position:fixed;inset:0;background:rgba(10,16,32,.55);display:grid;place-items:center;padding:1rem;z-index:10}
.modal{background:var(--surface);color:var(--ink);border-radius:22px;max-width:30rem;width:100%;max-height:90vh;overflow:auto;padding:1.4rem 1.2rem;display:flex;flex-direction:column;gap:1rem;text-align:center;border-top:8px solid var(--m)}
.modal .icon{margin:0 auto;width:4rem;height:4rem;font-size:2.1rem;border-radius:18px}
.modal ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem;text-align:left}
.modal ol li{display:flex;gap:.7rem;align-items:center;background:var(--bg);border-radius:14px;padding:.6rem .8rem;font-weight:600}
.modal ol li .n{flex:none;display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--m);color:#fff;font-weight:800}
.example{border:2px dashed var(--m);border-radius:14px;padding:.7rem .8rem;font-size:.95rem}
.example b{display:block;margin-bottom:.2rem}

.set{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem 0;border-bottom:2px solid var(--line)}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:.5rem .9rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:var(--on-cobalt)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-size:.95rem;font-weight:600;max-width:90vw;z-index:20}

/* ===== Space Adventure theme ===== */
:root:not([data-theme="zz"]){
  --bg:#0A0F24;--surface:#141B3D;--ink:#EEF2FF;--muted:#A9B4DA;--line:#2C3872;
  --cobalt:#6C84FF;--cobalt-deep:#3346B8;--on-cobalt:#FFFFFF;
  --sun:#FFC83D;--mint:#2EE6A6;--coral:#FF8A3D;--tile:#1C2552;--tile-ink:#F4F6FF;
  --c-lab:#22D3EE;--c-swap:#A78BFA;--c-spell:#60A5FA;--c-flip:#FB923C;--c-forge:#34D399;--c-speed:#F472B6;
  --pix:"Sora","Lexend",system-ui,sans-serif;
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:radial-gradient(1100px 600px at 85% -10%,rgba(124,92,255,.28),transparent 60%),radial-gradient(900px 520px at -15% 105%,rgba(34,211,238,.18),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.75;
  background-image:radial-gradient(1.5px 1.5px at 23px 41px,#fff,transparent),radial-gradient(1px 1px at 97px 13px,#cfe,transparent),radial-gradient(1px 1px at 151px 88px,#fff,transparent),radial-gradient(2px 2px at 211px 160px,#ffe9a8,transparent),radial-gradient(1px 1px at 61px 199px,#fff,transparent),radial-gradient(1.5px 1.5px at 181px 233px,#bcd,transparent),radial-gradient(1px 1px at 131px 141px,#fff,transparent);
  background-size:250px 250px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:.85}}
.wrap{position:relative}
body{overflow-x:hidden}
.map{overflow-x:clip}
h1,h2,.pixel{font-family:var(--pix);font-weight:800;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.2}
h2{font-size:1.35rem}
.brand .old-tile{background:linear-gradient(160deg,#25306A,#161E48);color:#E8FBFF;border:1px solid rgba(34,211,238,.55);border-bottom-width:1px;box-shadow:0 0 12px rgba(34,211,238,.3);font-family:var(--pix);border-radius:8px}
.pill{background:rgba(20,27,61,.85);border-color:var(--line);color:var(--ink)}
.card,.hero,.passage,.pick,.rule-row,.modal{background:linear-gradient(180deg,rgba(28,37,82,.88),rgba(18,24,56,.9));border:1px solid rgba(140,160,255,.22);box-shadow:0 12px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(6px)}
.rule-row{background:rgba(10,15,36,.6)}
.card,.hero{border-radius:20px}
.btn{border-radius:14px;background:linear-gradient(180deg,#7D93FF,#5670F0);box-shadow:0 6px 18px rgba(108,132,255,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(108,132,255,.3)}
.btn.go{background:linear-gradient(180deg,#5BF2C0,#22CF93);color:#04261B;box-shadow:0 6px 20px rgba(46,230,166,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.no{color:#2A1400}
.btn.ghost,.btn.hear,.back,.help,.readme,.seg button{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid rgba(140,160,255,.3);box-shadow:none}
.btn.hear{border-color:var(--m);box-shadow:0 0 16px color-mix(in srgb,var(--m) 35%,transparent)}
.go-big{color:#071022;border-radius:16px;font-family:var(--pix);font-weight:800;letter-spacing:0;background:linear-gradient(180deg,color-mix(in srgb,var(--m) 80%,#fff),var(--m));box-shadow:0 10px 28px color-mix(in srgb,var(--m) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.tile,.choice,.part{border-radius:12px;background:linear-gradient(180deg,#26306A,#1A2252);border:1px solid rgba(140,160,255,.3);border-bottom-width:1px;box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);font-weight:700}
.tile.ok,.choice.ok{border-color:var(--mint);background:linear-gradient(180deg,rgba(46,230,166,.28),rgba(46,230,166,.14))}
.tile.bad,.choice.bad{border-color:var(--coral);background:linear-gradient(180deg,rgba(255,138,61,.28),rgba(255,138,61,.12))}
.tile.swap{border-color:var(--sun);background:linear-gradient(180deg,rgba(255,200,61,.3),rgba(255,200,61,.14))}
.tile.end{border-color:var(--m);background:linear-gradient(180deg,color-mix(in srgb,var(--m) 34%,transparent),color-mix(in srgb,var(--m) 16%,transparent))}
.choice:hover:not(:disabled){box-shadow:0 0 14px color-mix(in srgb,var(--m) 45%,transparent)}
.icon{border-radius:10px;box-shadow:0 0 14px color-mix(in srgb,var(--m,#6C84FF) 45%,transparent)}
.dots i.now{box-shadow:0 0 10px var(--m)}
.dots i.ok{background:var(--mint);box-shadow:0 0 6px rgba(46,230,166,.5)}
.dots i.bad{background:var(--coral);box-shadow:0 0 6px rgba(255,138,61,.55)}
.dots-key{display:flex;gap:.9rem;justify-content:center;font-size:.75rem;color:var(--muted);margin:-.8rem 0 1rem}

function wireTyped(it,{isRight,rightHTML,wrongHTML,revealHTML,copy}){
  const inp=$("#ans"),chk=$("#check"),fb=$("#fb");let over=false,copying=false;

      if(!ok&&R.tries===0){R.tries++;fb.innerHTML=`<p class="msg bad">🔸 Not quite. You get one more try.</p>`+(R.section==="spell"?spellCompare(v,it.w):"");inp.select();speakFb();return;}
      disable();testRecord(it,ok&&R.tries===0,v,ok&&R.tries>0);return;}
    if(ok){resolve(it,R.tries===0);if(R.tries>0&&R.res)R.res[R.i]="two";const xp=R.tries===0?10:5;if(!it._rq)R.first++;award(xp);endWith(`<p class="msg good">${yay()}</p>`+rightHTML(v)+`<p class="gain">+${xp} points</p>`,disable);}
    else{R.tries++;if(R.tries>=2){resolve(it,false);requeue(it);if(copy)startCopy(v);else endWith(wrongHTML(v,true)+revealHTML(),disable);}else{fb.innerHTML=wrongHTML(v,false)+`<p class="muted small" data-say="You get one more try.">You get one more try.</p>`;inp.select();speakFb();}}

function wireChoices(it,{isRight,rightHTML,wrongHTML,revealHTML}){
  const btns=[...app.querySelectorAll("[data-v]")],fb=$("#fb");
  const disable=()=>btns.forEach(b=>b.disabled=true);

      disable();b.classList.add(ok?"ok":"bad");if(!ok){const r=btns.find(x=>isRight(x.dataset.v));if(r)r.classList.add("ok");}testRecord(it,ok&&R.tries===0,v,ok&&R.tries>0);return;}

function timedReader(p,{onDone,skipLabel,onSkip,listen=true}){
  let t0=null,timer=null;const words=wordCount(p.text);
  const html=`<ol class="how3" id="how3"><li class="on"><b>▶️</b>Tap Start</li><li><b>🗣️</b>Read out loud</li><li><b>⏹️</b>Tap Done</li></ol>
  <div class="card"><div class="timer" id="timer" aria-live="off">0:00</div>
  <div class="row center"><button class="btn go big" id="go">▶️ Start</button>${listen?`<button class="btn ghost" id="listen">🔊 Listen first</button>`:""}${skipLabel?`<button class="btn ghost" id="skipread">${skipLabel}</button>`:""}</div></div>
  <article class="passage">${p.text.split("\n").map(x=>`<p>${wrapWords(x)}</p>`).join("")}</article>`;
  function wire(){
    const steps=[...document.querySelectorAll("#how3 li")];const step=n=>steps.forEach((l,i)=>l.classList.toggle("on",i===n));
    if(listen)$("#listen").onclick=()=>speak(p.text.replace(/\n/g," "),null,[...document.querySelectorAll(".passage .w")]);
    if(skipLabel)$("#skipread").onclick=()=>{clearInterval(timer);onSkip();};
    const go=$("#go"),tEl=$("#timer");
    const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
    go.onclick=()=>{
      if(!t0){hush();t0=Date.now();tEl.textContent="0:00";go.textContent="⏹️ Done";step(1);timer=setInterval(()=>tEl.textContent=fmt((Date.now()-t0)/1000),250);$(".passage").scrollIntoView({behavior:"smooth",block:"start"});return;}

}

const SCAN_MILE={25:"🚀 25% done. Great start!",50:"🌗 Halfway there! Keep it up.",75:"🌠 75% done. The finish line is close!",90:"🏁 Almost done. Finish strong!"};
function scanCheer(ok){
  P.done++;P.streak=ok?P.streak+1:0;
  const pct=Math.round(P.done/P.total*100),prev=Math.round((P.done-1)/P.total*100);
  for(const m of [25,50,75,90])if(prev<m&&pct>=m)return {t:SCAN_MILE[m],say:true};
  if([3,5,8,12].includes(P.streak))return {t:`🔥 ${P.streak} in a row! You're on fire.`,say:false};
  if(P.done%4===0)return {t:CHEERS[Math.floor(Math.random()*CHEERS.length)],say:false};

}

function pctOf(arr){return arr&&arr.length?Math.round(arr.filter(r=>r.ok).length/arr.length*100):null;}

function level(v){if(v==null)return ["skip","Skipped"];if(v>=85)return ["strong","💪 Strong"];if(v>=60)return ["mid","👍 Getting there"];return ["focus","🎯 Focus here"];}

const MISS_SECS=[["sounds","🎧","Sounds"],["spell","✏️","Spelling"],["order","🔀","Twin words"],["parts","🧩","Word parts"],["decode","🗣️","Reading made-up words"]];
function missItem(m){
  const it=m.it,v=m.v,yours=x=>`<span class="yours">${esc(x)}</span>`,ans=x=>`<span class="ans">${esc(x)}</span>`;
  if(m.sec==="sounds"&&it.kind==="count")return `<p><b>${esc(it.word)}</b>: you picked ${yours(v)}. It has ${ans(it.sounds.length)} sounds.</p>${tiles(it.sounds,it.sounds.map(()=>"ok"),true)}<p class="why">Why: count sounds, not letters.${it.note?" "+esc(it.note):""}</p>`;

  if(m.sec==="spell"){const w=it.w,t=String(v||""),same=sameLetters(t,w),p=PATTERNS[it.p];
    const cls=[...t].map((c,i)=>c===w[i]?"ok":(same?"swap":"bad"));
    return `<p>You spelled ${yours(t||"—")}.</p>${t?tiles([...t],cls,true):""}<p class="lbl-sm">Correct spelling: ${ans(w)}</p>${okTiles(w)}${meaningHTML(w)}<p class="why">Why: ${same?"all the right letters, but some are in the wrong order (yellow). ":""}${p?`This is a <b>${esc(p.name)}</b> word. ${esc(p.rule)}`:""}</p>`;}
  if(m.sec==="order"){const filled=esc(it.s).replace("___",`<span class="ans">${esc(it.a)}</span>`);

  if(m.sec==="parts")return `<p>“${esc(it.def)}”: you built ${yours(v||"—")}. Answer: ${ans(it.word)}</p><p class="why">Why: ${it.parts.map(x=>`<b>${esc(x[0])}</b> means ${esc(x[1])}`).join(" + ")}.</p>`;

}
function missesHTML(rec){

function demoWord(i){const p=PATTERNS[i];const w=p.eg.split(",")[0].trim();const hit=p.words.find(x=>x[0]===w)||p.words[0];return {w:hit[0],s:hit[1]};}

function markDemo(key){S.demoSeen[key]=dayStr();save();}
function withDemo(mode,key,stepsFn,start){if(!needDemo(key))return start();runDemo(mode,stepsFn(),()=>{markDemo(key);start();});}
function runDemo(mode,steps,onDone){
  hush();
  frame(mode,`<div class="card"><span class="demo-tag">👀 Watch me do one</span>
    <div class="demo-stage" id="demo-stage" aria-live="polite"></div>
    <p class="demo-cap" id="demo-cap"></p>
    <div class="row center"><button class="btn ghost" id="demo-again">🔁 Watch again</button><button class="btn go big" id="demo-go">My turn ▶</button></div></div>`,{demo:true});

  $("#demo-again").onclick=()=>play();
  $("#demo-go").onclick=()=>{hush();onDone();};
  async function play(){
    hush();const tok=demoTok;
    for(const st of steps){
      if(tok!==demoTok)return;
      const stage=$("#demo-stage"),cap=$("#demo-cap");if(!stage)return;
      stage.innerHTML=st.html;cap.innerHTML=wrapWords(plain(st.say));

const DEMOS={
  swap:()=>{const d=DEMO_SWAP;return [
    {html:`<p class="word">${d.say}</p>`,say:`Watch me do one. My word is ${d.say}.`},

    {html:tileRow(["sh","o","p"],["swap"]),say:"So I swap the first sound. Out goes the chip sound. In goes the ship sound."},

    {html:`<div class="tiles">${L.map(c=>`<span class="tile ghost">${esc(c)}</span>`).join("")}</div>`,

     say:`Now I say each letter out loud as I type it. ${spellOut(w)}.`},

  ];}

const LT=w=>String(w).toUpperCase().split("").join(", ");
function labClue(it){
  if(it.ex)return `${it.base} is a rule-breaker: the t changes to ss, so it takes -sion.`;
  if(it.end==="tion")return `${it.base} ends in ${/te$/.test(it.base)?"te":"t"}, so it takes -tion.`;
  if(/ss$/.test(it.base))return `${it.base} ends in ss, so it takes -sion.`;
  if(/(de|se)$/.test(it.base))return `${it.base} ends in ${it.base.slice(-2)}, so it takes -sion.`;
  if(/d$/.test(it.base))return `${it.base} ends in d, so it takes -sion.`;
  return "It takes -sion.";
}
function clueShow(c){return c.replace(/-(tion|sion)/g,"\u2011$1");}
function clueSay(c){return c.replace(/-(tion|sion)/g,(m,x)=>LT(x));}
function labSay(it){return it.syl.map(x=>x==="tion"?"shun":x==="sion"?(it.zh?"zhun":"shun"):x).join(". ")+". "+it.word+".";}
function labTiles(it){return `<div class="tiles sm">${[...it.stem].map(c=>`<span class="tile ok">${esc(c)}</span>`).join("")}<span class="tile end">${esc(it.end)}</span></div>`;}
function labSyl(it){return `<div class="syl">${it.syl.map((x,i)=>`<span class="sy ${i%2?"b":"a"}${i===it.syl.length-1?" e":""}">${esc(x)}</span>`).join("")}</div>`;}

function buildLab(){
  const n=roundSize("lab",10);
  const zh=shuffle(LAB.filter(x=>x.zh)),sh=shuffle(LAB.filter(x=>!x.zh));
  const pool=shuffle([...zh.slice(0,4),...sh.slice(0,8)]);
  const kinds=["sound","sound","choose","choose","choose","chunk","chunk","spell","spell","read","choose","spell"].slice(0,n);
  let pi=0;
  const items=kinds.map((k,i)=>Object.assign({},k==="sound"?(i===0?zh[zh.length-1]:sh[sh.length-1]):pool[pi++%pool.length],{kind:k}));
  const rev=Object.values(S.missed.lab||{}).slice(0,3).map(x=>Object.assign({},x.it,{_rev:true}));
  const keys=new Set(rev.map(x=>x.word));
  const order={sound:0,choose:1,chunk:2,spell:3,read:4};
  return [...items.filter(x=>!keys.has(x.word)).slice(0,Math.max(0,n-rev.length)),...rev].sort((a,b)=>order[a.kind]-order[b.kind]);
}

      if(body.avatar){delete x.cls.avatarDirty;setProfiles();}
      if(j.restore&&j.restore.savedAt&&(!S.savedAt||j.restore.savedAt>S.savedAt)&&PROF.last===id&&!R&&!P){
        try{localStorage.setItem(KEY,JSON.stringify(j.restore));}catch(e){}S=load();renderHud();
      }
      if(getOutbox(id).length)syncSoon();
    }
  }catch(e){}finally{syncing=false;}
}
addEventListener("online",()=>syncNow());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")syncNow();});

function classShell(kicker,title,body){
  R=null;P=null;hush();
  document.querySelector(".hud").style.visibility="hidden";document.querySelector("header").style.visibility="hidden";
  app.innerHTML=`<div class="hero signin"><div><p class="mc-kicker">${kicker}</p><h1 style="margin:0">${title}</h1></div>${body}</div>`;window.scrollTo(0,0);
}
function joinClass(prefill){
  classShell("Join my class","Type your class code",`
    <p class="muted" style="margin:0;text-align:center">Your teacher has a 6-letter code.</p>
    <input id="ccode" class="code-in" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Class code" value="${esc(prefill||"")}">
    <p class="pinmsg" id="cmsg" role="status"></p>
    <div class="row center"><button class="btn ghost" id="cc-back">Back</button><button class="btn go big" id="cc-go">Next ▶</button></div>`);
  const inp=$("#ccode");inp.addEventListener("input",()=>{inp.value=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);});
  $("#cc-back").onclick=()=>signIn();
  const go=async()=>{const code=inp.value;if(code.length!==6){$("#cmsg").textContent="The code has 6 letters and numbers.";inp.focus();return;}
    $("#cc-go").disabled=true;$("#cmsg").className="pinmsg";$("#cmsg").textContent="Checking…";
    let j;try{j=await classApi({action:"lookup",code});}catch(e){j={error:"offline"};}
    $("#cc-go").disabled=false;
    if(j.learners){return pickName(code,j);}
    $("#cmsg").textContent=j.error==="school_network_only"?"Class sign-in only works on your school's network.":j.error==="offline"?"No internet right now. Try again in a moment.":j.error==="slow_down"?"Too many tries. Wait a few minutes.":"Hmm, that code didn't work. Check it with your teacher.";inp.focus();};
  $("#cc-go").onclick=go;inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  setTimeout(()=>inp.focus(),60);
  narrate("Type your class code. Your teacher has it.",{short:"Type your class code."});
}
function pickName(code,j){
  const ls=j.learners;
  classShell(`🏫 <span class="classname">${esc(j.className)}</span>`,"Tap your name",
    ls.length?`<div class="pilots">${ls.map(l=>`<button class="pilot" data-lid="${l.id}"><span class="av">${esc(l.avatar||"🧑‍🚀")}</span><span class="pn">${esc(l.name)}</span></button>`).join("")}</div>
      <div class="row center"><button class="btn ghost" id="pn-back">Back</button></div>`
    :`<p style="text-align:center">No names in this class yet. Ask your teacher to add you.</p><div class="row center"><button class="btn ghost" id="pn-back">Back</button></div>`);
  $("#pn-back").onclick=()=>joinClass(code);
  app.querySelectorAll("[data-lid]").forEach(b=>b.onclick=()=>{const l=ls.find(y=>y.id===b.dataset.lid);pinScreen({code,learner:l,className:j.className});});
  narrate("Tap your name.",{short:"Tap your name."});
}
/* Picture PIN: used to join on a new device, and every time a class pilot signs in on a shared device */
function pinScreen(o){
  const x=o.pilot,name=x?x.name:o.learner.name,av=x?x.avatar:(o.learner.avatar||"🧑‍🚀");let pin=[],busy=false;
  classShell(`${esc(av)} ${esc(name)}`,"Tap your 4 secret pictures",`
    <div class="pinslots" aria-live="polite">${[0,1,2,3].map(()=>"<span></span>").join("")}</div>
    <p class="pinmsg" id="pmsg" role="status"></p>
    <div class="pinpad">${PICS.map((p,i)=>`<button data-pic="${i}" aria-label="${p[1]}">${p[0]}</button>`).join("")}</div>
    <div class="row center"><button class="btn ghost" id="pp-back">Back</button><button class="btn ghost" id="pp-undo">⌫ Undo</button></div>
    <p class="privacy">Forgot your pictures? Ask your teacher.</p>`);
  const slots=[...app.querySelectorAll(".pinslots span")],msg=$("#pmsg");
  const draw=()=>slots.forEach((s,i)=>{s.textContent=pin[i]!=null?PICS[pin[i]][0]:"";s.classList.toggle("on",pin[i]!=null);});
  $("#pp-back").onclick=()=>signIn();
  $("#pp-undo").onclick=()=>{if(busy)return;pin.pop();draw();};
  app.querySelectorAll("[data-pic]").forEach(b=>b.onclick=()=>{if(busy||pin.length>=4)return;pin.push(+b.dataset.pic);draw();if(pin.length===4)check();});
  async function check(){
    busy=true;msg.className="pinmsg";msg.textContent="Checking…";const code=pin.join("-");
    const cls=x?x.cls:null,lid=x?cls.lid:o.learner.id,ccode=x?cls.code:o.code;
    // Same device, same pictures as last time: let them in even without internet.
    if(cls&&cls.pinHash&&cls.pinHash===await sha(lid+":"+code)){queueEvent({type:"login",device:deviceName()},x.id);return enter(x);}
    let j;try{j=await classApi({action:"login",code:ccode,learnerId:lid,pin:code,device:deviceName()});}catch(e){j={error:"offline"};}
    if(j.token){
      const hash=await sha(lid+":"+code);
      let p=x||PROF.list.find(y=>y.cls&&y.cls.lid===lid);
      const isNew=!p;
      if(!p){ // link a same-name pilot on this device that isn't in a class yet, so home progress carries over
        p=!j.state&&PROF.list.find(y=>!y.cls&&y.name&&y.name.toLowerCase()===j.learner.name.toLowerCase());
        if(!p){p={id:"p"+Date.now().toString(36),name:j.learner.name,avatar:j.learner.avatar||AVATARS[0]};PROF.list.push(p);}
      }
      p.name=j.learner.name;
      p.cls={code:ccode,lid,token:j.token,className:j.className,pinHash:hash};
      if(j.state){const cur=pilotSave(p.id);if(!cur.savedAt||j.state.savedAt>cur.savedAt){try{localStorage.setItem("decode-space-v1:"+p.id,JSON.stringify(j.state));}catch(e){}}}
      setProfiles();
      msg.className="pinmsg ok";msg.textContent="✅ Welcome aboard!";
      if(isNew&&(!j.learner.avatar||j.learner.avatar==="🧑‍🚀")&&!j.state){p.cls.avatarDirty=true;setProfiles();PROF.last=p.id;setProfiles();KEY="decode-space-v1:"+p.id;S=load();return setTimeout(()=>pilotForm(p.id),500);}
      return setTimeout(()=>enter(p),400);
    }
    busy=false;pin=[];draw();
    msg.textContent=j.error==="school_network_only"?"Class sign-in only works on your school's network.":j.error==="offline"?"No internet right now, and those pictures don't match. Try again.":
      j.error==="locked"?`Too many tries. Wait ${j.minutes||5} minutes, or ask your teacher.`:
      j.error==="wrong_pin"?`Not quite. Try again${j.left?` (${j.left} ${j.left===1?"try":"tries"} left)`:""}.`:
      j.error==="no_learner"||j._status===404?"You're not in this class anymore. Ask your teacher.":"Something went wrong. Try again.";
    if(talkMode()!=="quiet")speak(j.error==="wrong_pin"?"Not quite. Try again.":msg.textContent);
  }
  function enter(p){switchTo(p.id);syncNow();}
  narrate("Tap your 4 secret pictures.",{short:"Tap your 4 secret pictures."});
}
/* ---------- Feedback form: saved in the database and emailed to Akra Technologies ---------- */
const FEEDBACK_URL="https://atsgfhkzhnzjzylwzmkv.supabase.co/functions/v1/decode-feedback";
const APP_VERSION="24";
const FB_FEATURES=[["overall","⭐","The whole game"],["missions","🪐","The missions (games)"],["voice","🤖","Orbit's voice and directions"],["scan","🔍","The Level Scan"],["rewards","🏅","Ranks, badges, and crates"],["look","✨","How it looks"],["speed","⚡","How fast it runs"]];
const FACES=[["😞","Really bad"],["🙁","Not good"],["😐","OK"],["🙂","Good"],["😍","Awesome"]];
function feedbackView(){
  R=null;P=null;hush();setColor("lab");
  const pc=curPilot(),st={role:"student",kind:"",ratings:{}};
  let draft={};try{draft=JSON.parse(localStorage.getItem("decode-space-fbdraft")||"{}");}catch(e){}
  app.innerHTML=`<div class="hero"><button class="back" id="fb-back">← Home</button>
    <div class="orbit-hi" style="margin:.6rem 0 1rem">${orbitImg("point")}<div><p class="mc-kicker">💬 Feedback</p><h1 style="margin:0">Tell us what you think!</h1><p class="muted" style="margin:.2rem 0 0">Your ideas help make Decode better.</p></div></div>
    <form class="fb-form" id="fbf" novalidate>
      <div class="fb-sec"><h2>1. I am a…</h2><div class="chips" data-group="role">
        ${[["student","🧑‍🚀 Student"],["parent","👪 Parent"],["teacher","🍎 Teacher"],["other","🙂 Other"]].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===st.role}">${l}</button>`).join("")}</div></div>
      <div class="fb-sec"><h2>2. Tap a face for each part</h2><p class="muted small" style="margin:-.3rem 0 0">Skip any part you haven't tried.</p>
        ${FB_FEATURES.map(([k,e,l])=>`<div class="rate-row"><span>${e} ${l}</span><div class="faces" role="group" aria-label="${l}" data-rate="${k}">${FACES.map(([f,t],i)=>`<button type="button" data-n="${i+1}" aria-label="${t}" aria-pressed="false">${f}</button>`).join("")}</div></div>`).join("")}</div>
      <div class="fb-sec"><h2>3. What do you want to tell us?</h2><div class="chips" data-group="kind">
        ${[["love","💚 I love something"],["idea","💡 I have an idea"],["broken","🔧 Something isn't working"],["other","💬 Something else"]].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="false">${l}</button>`).join("")}</div>
        <textarea class="fb-text" id="fb-msg" maxlength="1500" placeholder="Type your comment here…">${esc(draft.message||"")}</textarea>
        <p class="muted small" style="margin:-.2rem 0 0">🎤 Tip: tap the microphone on your keyboard to talk instead of typing.</p></div>
      <div class="fb-sec"><h2>4. Your first name <span class="muted small">(optional)</span></h2><input class="fb-in" id="fb-name" maxlength="40" autocomplete="off" value="${esc(pc&&pc.name||"")}"></div>
      <div class="fb-sec" id="fb-email-sec" hidden><h2>5. Your email <span class="muted small">(only if you'd like a reply)</span></h2><input class="fb-in" id="fb-email" type="email" maxlength="120" autocomplete="email"></div>
      <div class="hp" aria-hidden="true"><label>Leave this empty<input id="fb-hp" tabindex="-1" autocomplete="off"></label></div>
      <p class="pinmsg" id="fb-status" role="status"></p>
      <div class="row center"><button class="btn go big" id="fb-send" type="submit">Send ▶</button></div>
      <p class="privacy">🔒 Students: please don't type your last name, address, or phone number.</p>
    </form></div>`;
  window.scrollTo(0,0);
  $("#fb-back").onclick=home;
  const msg=$("#fb-msg"),status=$("#fb-status");
  msg.addEventListener("input",()=>{if(status.textContent&&!status.classList.contains("ok"))status.textContent="";try{localStorage.setItem("decode-space-fbdraft",JSON.stringify({message:msg.value}));}catch(e){}});
  app.querySelectorAll("[data-group]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));st[g.dataset.group]=b.dataset.v;
    if(g.dataset.group==="role")$("#fb-email-sec").hidden=b.dataset.v==="student";
  }));
  app.querySelectorAll("[data-rate]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const on=b.getAttribute("aria-pressed")!=="true";
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
    if(on){b.setAttribute("aria-pressed","true");st.ratings[g.dataset.rate]=+b.dataset.n;}else delete st.ratings[g.dataset.rate];
  }));
  $("#fbf").onsubmit=async e=>{
    e.preventDefault();const text=msg.value.trim();
    if(!text){status.className="pinmsg";status.textContent="Please type a comment first. A few words is fine!";msg.focus();return;}
    const btn=$("#fb-send");btn.disabled=true;status.className="pinmsg ok";status.textContent="Sending…";
    const body={source:"game",role:st.role,kind:st.kind||"other",ratings:st.ratings,message:text,name:$("#fb-name").value.trim(),
      reply_email:st.role==="student"?"":$("#fb-email").value.trim(),version:APP_VERSION,device:deviceName(),website:$("#fb-hp").value};
    let ok=false,err="";
    try{const r=await fetch(FEEDBACK_URL,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+TTS_ANON,apikey:TTS_ANON},body:JSON.stringify(body)});
      const j=await r.json().catch(()=>({}));ok=r.ok&&j.ok;err=j.error||"";}catch(x){err="offline";}
    if(ok){
      try{localStorage.removeItem("decode-space-fbdraft");}catch(x){}
      app.innerHTML=`<div class="hero" style="text-align:center"><div class="trophy has-img">${orbitTrophy("💚")}</div><h1 style="margin:.4rem 0">Thank you!</h1><p class="muted">Your feedback was sent. Orbit is passing it to the team.</p><div class="row center"><button class="btn go big" id="fb-home">Back to base ▶</button></div></div>`;
      $("#fb-home").onclick=home;narrate("Thank you! Your feedback was sent.",{short:"Thank you!"});return;
    }
    btn.disabled=false;status.className="pinmsg";
    status.textContent=err==="offline"?"No internet right now. Your comment is saved here, so try again later.":err==="slow_down"?"That's a lot of messages! Please wait a few minutes.":"Something went wrong. Your comment is saved here, so try again later.";
  };
  narrate("Tell us what you think! Tap a face for each part of the game, then type your comment and tap Send.",{short:"Tap a face for each part, then type your comment."});
}
function startApp(){const pc=curPilot();if(PROF.list.length===1&&pc&&pc.name)return switchTo(pc.id);signIn();}
(()=>{const bg=new Image();bg.onload=()=>document.body.classList.add("has-bg");bg.src="img/space-bg.webp";})();
$("#hud-pilot").onclick=()=>{if(P&&!confirmLeave())return;signIn();};
applySettings();renderHud();startApp();

</script>
